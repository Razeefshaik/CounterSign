services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: countersign
      POSTGRES_USER: countersign
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-countersign-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - countersign_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U countersign -d countersign"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  countersign_postgres:
