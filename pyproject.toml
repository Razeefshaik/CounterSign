[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "countersign"
version = "0.1.0"
description = "AI proposes, code countersigns: safe marketplace money operations."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
llm = [
    "langchain==1.4.7",
    "langchain-core==1.7.0",
    "langchain-google-genai==4.4.2",
    "google-genai==2.33.0",
]
dev = [
    "httpx",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "import-linter",
    "alembic",
    "psycopg[binary,pool]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["countersign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires COUNTERSIGN_TEST_DATABASE_URL pointing to PostgreSQL 16"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.importlinter]
root_package = "countersign"

# The sole root package is countersign. Root wildcards let the skeleton pass
# before these planned modules exist, while enforcing the rules as they arrive.
[[tool.importlinter.contracts]]
name = "Agent cannot reach money writes or core execution internals"
type = "forbidden"
source_modules = ["*.agent"]
forbidden_modules = [
    "*.paypal.write",
    "*.paypal.sandbox_controls",
    "*.executor",
    "*.db",
]

[[tool.importlinter.contracts]]
name = "Only the executor may import the PayPal write adapter"
type = "protected"
protected_modules = ["*.paypal.write"]
allowed_importers = ["*.executor"]

[[tool.importlinter.contracts]]
name = "The shield stays pure: no database, PayPal, executor or agent imports"
type = "forbidden"
source_modules = ["*.shield"]
forbidden_modules = ["*.db", "*.paypal", "*.executor", "*.agent"]
